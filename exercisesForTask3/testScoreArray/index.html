<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Score Array</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Use a Test Score Array</h1>

        <!-- Form -->
        <div class="form">

            <div class="form-row">
                <label for="name">Name:</label>
                <input type="text" id="name">
            </div>

            <div class="form-row">
                <label for="score">Score:</label>
                <input type="number" id="score">
            </div>

            <div class="buttons">
                <button onclick="addScore()">Add to Array</button>
                <button onclick="displayResults()">Display Results</button>
                <button onclick="displayScores()">Display Scores</button>
            </div>

        </div>

        <!-- Results -->
        <h2>Results</h2>

        <div id="results">
            <p>Average score = <span id="average">0</span></p>
            <p>High score = <span id="highScore"></span> with a score of <span id="highValue">0</span></p>
        </div>

        <!-- Scores -->
        <h2>Scores</h2>

        <table id="scoreTable">
                <tr>
                    <th>Name</th>
                    <th>Score</th>
                </tr>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
